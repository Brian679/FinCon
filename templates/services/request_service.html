{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Request Service: {{ service.name }}</h2>
                    <p class="lead">Price: ${{ service.price }}</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="notes" class="form-label">Additional Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="5" 
                                      placeholder="Please provide any additional information..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Request</button>
                        <a href="{% url 'service_detail' service.slug %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
