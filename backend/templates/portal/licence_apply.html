{% extends "base.html" %}
{% block content %}
<h1 class="h3">Apply for a licence</h1>
<div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">Council account</label><select class="form-select" name="account">{% for a in accounts %}<option value="{{ a.pk }}">{{ a.account_number }} – {{ a.name }}</option>{% endfor %}</select></div>
{% include "generic/_form_fields.html" %}<button class="btn btn-primary mt-3">Submit application</button></form>
<p class="small text-muted mt-3">Shop and food premises are inspected by the Environmental Health Officer. After approval you pay the fee online and your licence is issued immediately.</p></div></div>
{% endblock %}
