{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<h1 class="h4">Change password</h1>
{% if user.must_change_password %}<div class="alert alert-warning">For security you must replace the temporary password issued by the administrator before continuing.</div>{% endif %}
<div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}{% include "generic/_form_fields.html" %}<button class="btn btn-primary mt-3">Change password</button></form></div></div>
</div></div>
{% endblock %}
