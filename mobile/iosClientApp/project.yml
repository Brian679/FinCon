# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: iosClientApp
options:
  bundleIdPrefix: zw.gov.chipingerdc
  deploymentTarget:
    iOS: "15.0"
targets:
  iosClientApp:
    type: application
    platform: iOS
    sources: [iosClientApp]
    info:
      path: iosClientApp/Info.plist
      properties:
        CFBundleDisplayName: Chipinge RDC
        CRDCServerURL: "https://ems.chipingerdc.gov.zw"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        NSCameraUsageDescription: "Photograph letters, invoices and delivery notes to attach them."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zw.gov.chipingerdc.client
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../clientApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ClientApp -lsqlite3"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :clientApp:embedAndSignAppleFrameworkForXcode
