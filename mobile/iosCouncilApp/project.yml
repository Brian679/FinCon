# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: iosCouncilApp
options:
  bundleIdPrefix: zw.gov.chipingerdc
  deploymentTarget:
    iOS: "15.0"
targets:
  iosCouncilApp:
    type: application
    platform: iOS
    sources: [iosCouncilApp]
    info:
      path: iosCouncilApp/Info.plist
      properties:
        CFBundleDisplayName: CRDC Council
        CRDCServerURL: "https://ems.chipingerdc.gov.zw"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zw.gov.chipingerdc.council
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../councilApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework CouncilApp -lsqlite3"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :councilApp:embedAndSignAppleFrameworkForXcode
